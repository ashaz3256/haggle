# Render Blueprint: New > Blueprint > pick this repo. Render prompts for every `sync: false` value.
# The free plan has no persistent disk, so SQLite lives on the instance's local filesystem: `npm start`
# re-creates the schema and re-seeds the demo listings on every boot, and deals reset when the instance
# restarts or spins down. Add a disk (paid plan) mounted at /data and set DATABASE_URL=file:/data/haggle.db to keep them.
services:
  - type: web
    name: haggle
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /how-it-works
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:./render.db
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: NEG_RATE_LIMIT
        value: "12"
      # OpenAI-compatible LLM endpoint for the agents (or set ANTHROPIC_API_KEY instead)
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_FALLBACK_MODELS
        sync: false
      # PayPal sandbox app (developer.paypal.com > Apps & Credentials > Sandbox)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Same client id; read at build time by the PayPal buttons
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # Optional: Channel3 product search for the market check
      - key: CHANNEL3_API_KEY
        sync: false
